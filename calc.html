<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proteina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Calculadora de Proteína</h2>

                        <form id="meuFormulario">
                            <div class="mb-3">
                                <label for="peso" class="form-label">Qual é seu peso?</label>
                                <input type="number" class="form-control" id="peso" name="peso" value="90" required>
                            </div>

                            <div class="mb-3">
                                <label for="objetivo" class="form-label">Qual é seu objetivo?</label>
                                <select class="form-select" name="objetivo" id="objetivo">
                                    <option value="Emagrecer">Emagrecer</option>
                                    <option value="Ganhar massa">Ganhar massa</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="nivel_atividade" class="form-label">Nível de atividade fisica</label>
                                <select class="form-select" name="nivel_atividade" id="nivel_atividade">
                                    <option value="baixo">Baixo</option>
                                    <option value="medio">Medio</option>
                                    <option value="Alto">Alto</option>
                                </select>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Calcular</button>
                            </div>

                            <p id="resultadoTexto" class="mt-3 text-center fw-bold"></p>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
