<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proteina</title>
</head>
<body>

    <div class="form_peso_atual">
        <form id="peso" method="post">
            <div class="form_peso">
                <label for="Peso Atual"></label>
                <input type="number" id="peso" name="peso" required placeholder="Digite seu peso">
            </div>
    </div>

    <div class="form_objetivo">
        <form id="objetivo" method="post">
            <div class="form_objetivo">
                <label for="Objetivo atual (emagrecer, perder peso ou ganhar massa?)"></label>
                <input type="text" id="objetivo" name="objetivo" required placeholder="Digite seu objetivo">
    </div>

    <div class="form_nivel_aividade">
        <form id="nivel" method="post">
            <div class="form_nivel_atividade">
                <label for="Nivel atividade fisica (Baixo, medio ou alto?)"></label>
                <input type="text" id="nivel_aividade" name="nivel_atividade" required placeholder="Digite seu nivel de atividade Fisica">
    </div>
    
</body>
</html>
