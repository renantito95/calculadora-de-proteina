<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proteina</title>
</head>
<body>
    <form id="meuFormulario">
        <label for="peso">Qual é seu peso?</label>
        <input type="number" id="peso" name="peso" value="90" required>

        <label for="objetivo">Qual é seu objetivo?</label>
        <select name="objetivo" id="objetivo">
            <option value="Emagrecer">Emagrecer</option>
            <option value="Ganhar massa">Ganhar massa</option>
        </select>

        <label for="nivel_atividade">Nível de atividade fisica</label>
        <select name="nivel_atividade" id="nivel_atividade">
            <option value="baixo">Baixo</option>
            <option value="medio">Medio</option>
            <option value="Alto">Alto</option>
        </select>

        <button type="submit">Calcular</button>

        <p id="resultadoTexto"></p>
    </form>
    
    <script src="script.js"></script>

</body>
</html>
