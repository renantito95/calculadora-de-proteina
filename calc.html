<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Proteina</title>
</head>
<body>

    <div>
        <form action="#" method="post">
            <h3>Qual é o seu peso?</h3>
            <label for="Peso"></label>
            <input type="number" required">
        </form>
    </div>

    <div>
        <form action="#" method="post">
            <h3>Qual é o seu objetivo? (Emagrecer, Perder peso ou Ganhar massa)</h3>
            <label for="objetivo"></label>
            <select name="objetivo" id="objetivo">
                <option value="emagrecer">Emagrecer</option>
                <option value="perder peso">Perder peso</option>
                <option value="ganhar massa">Ganhar massa</option>
            </select>
        </form>
    </div>

    <div>
        <form action="#" method="post">
            <h3>Nivel de atividade fisica (baixo, medio, alto)?</h3>
            <label for="nivel de atividade fisica"></label>
            <select name="nivel de atividade fisica" id="nivel_atividade">
                <option value="baixo">Baixo</option>
                <option value="medio">Medio</option>
                <option value="alto">Alto</option>
            </select>
        </form>
        <button type="submit">Calcular</button>
    </div>
    
</body>
</html>
